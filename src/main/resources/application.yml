spring:
  application:
    name: employee-management-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_db}
    username: ${DB_USERNAME:employee_user}
    password: ${DB_PASSWORD:employee_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  error:
    include-message: never

app:
  jwt:
    # Change this through JWT_SECRET in every non-local environment. Must be >= 32 characters.
    secret: ${JWT_SECRET:local-development-secret-change-me-please-12345}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:admin@ems.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}

logging:
  level:
    com.employee.management: INFO
    org.springframework.security: WARN
